<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math MCQ Practice</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="topbar">
  <div class="brand">📐 Math MCQ Practice</div>
  <button id="darkToggle" class="icon-btn" aria-label="Toggle dark mode">🌙</button>
</div>

<div class="container">

  <!-- 1. Student Info -->
  <section id="screen-info" class="screen card active">
    <h1>Student Information</h1>
    <form id="infoForm" novalidate>
      <div class="form-group">
        <label for="studentName">Name</label>
        <input type="text" id="studentName" placeholder="Enter your full name" required>
        <span class="error" id="errName"></span>
      </div>
      <div class="form-group">
        <label for="studentAge">Age</label>
        <input type="number" id="studentAge" placeholder="Enter your age" required min="1">
        <span class="error" id="errAge"></span>
      </div>
      <button type="submit" class="btn btn-primary">Continue</button>
      <button type="button" id="viewHistoryBtn" class="btn btn-secondary">View History</button>
    </form>
  </section>

  <!-- 2. Quiz Config -->
  <section id="screen-config" class="screen card">
    <h1>Quiz Configuration</h1>
    <form id="configForm">
      <div class="form-group">
        <label for="numQuestions">Number of Questions (10–100)</label>
        <input type="number" id="numQuestions" min="10" max="100" value="10" required>
      </div>
      <div class="form-group">
        <label>Quiz Mode</label>
        <div class="radio-row">
          <label class="radio-pill"><input type="radio" name="mode" value="one" checked> One Question at a Time</label>
          <label class="radio-pill"><input type="radio" name="mode" value="full"> Full List Mode</label>
        </div>
      </div>
      <div class="form-group">
        <label for="difficulty">Difficulty</label>
        <select id="difficulty">
          <option value="Easy">Easy</option>
          <option value="Medium">Medium</option>
          <option value="Hard">Hard</option>
          <option value="Mixed" selected>Mixed</option>
        </select>
      </div>
      <div class="form-group">
        <label for="topic">Topic</label>
        <select id="topic">
          <option value="Algebra">Algebra</option>
          <option value="Calculus">Calculus</option>
          <option value="Geometry">Geometry</option>
          <option value="Trigonometry">Trigonometry</option>
          <option value="Statistics">Statistics</option>
          <option value="Mixed" selected>Mixed</option>
        </select>
      </div>
      <span class="error" id="errConfig"></span>
      <div class="btn-row">
        <button type="button" class="btn btn-secondary" data-back="screen-info">Back</button>
        <button type="submit" class="btn btn-primary">Start Quiz</button>
      </div>
    </form>
  </section>

  <!-- 3. One Question Mode -->
  <section id="screen-quiz-one" class="screen card">
    <div class="quiz-header">
      <div class="quiz-meta">
        <span id="qCounter">Question 1 / 10</span>
        <span id="scoreDisplay">Score: 0</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <h2 id="questionText" class="question-text"></h2>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="btn-row">
      <button id="submitAnswerBtn" class="btn btn-primary">Submit</button>
      <button id="nextQuestionBtn" class="btn btn-primary hidden">Next Question</button>
    </div>
  </section>

  <!-- 5. Full List Mode -->
  <section id="screen-quiz-full" class="screen card">
    <h1>Quiz</h1>
    <div id="fullListContainer"></div>
    <div class="btn-row">
      <button id="submitFullBtn" class="btn btn-primary">Submit Quiz</button>
    </div>
  </section>

  <!-- 6 & 7. Result -->
  <section id="screen-result" class="screen card">
    <h1>Your Results</h1>
    <div class="result-grid" id="resultSummary"></div>
    <p class="performance-msg" id="performanceMsg"></p>
    <div class="btn-row">
      <button id="downloadCsvBtn" class="btn btn-secondary">Download Result CSV</button>
      <button id="reviewBtn" class="btn btn-secondary">Show Answer Review</button>
      <button id="restartBtn" class="btn btn-primary">New Quiz</button>
    </div>
    <div id="reviewContainer" class="review-container hidden"></div>
  </section>

  <!-- 8. History -->
  <section id="screen-history" class="screen card">
    <h1>Quiz History</h1>
    <div id="historyContainer"></div>
    <div class="btn-row">
      <button class="btn btn-primary" data-back="screen-info">Back</button>
      <button id="clearHistoryBtn" class="btn btn-secondary">Clear History</button>
    </div>
  </section>

</div>

<script src="js/storage.js"></script>
<script src="js/csv.js"></script>
<script src="js/quiz.js"></script>
<script src="js/app.js"></script>
</body>
</html>
